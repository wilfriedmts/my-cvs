<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Accès aux CV</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      background: rgb(156 163 175 / var(--tw-bg-opacity, 1));
    }

    .container {
      text-align: center; 
      background: white;
      padding: 40px;
      border-radius: 12px;
      width: 320px;
      box-shadow: 0 4px 20px #0001;
    }

    input,
    button {
      box-sizing: border-box;
      width: 100%;
      padding: 12px;
      margin-top: 12px;
      border-radius: 6px;
    }

    input {
      border: 1px solid #ccc;
    }

    button {
      border: none;
      background: #222;
      color: white;
      cursor: pointer;
    }

    #error {
      color: red;
      white-space: pre-line;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Bienvenue <br>Welcome</h1>

    <p>Veuillez saisir votre code d'accès. <br>Please type your access code below.</p>

    <input type="text" id="code" placeholder="Code d'accès / Access code" autocomplete="off">

    <button onclick="accessFolder()">
      OK
    </button>

    <p id="error"></p>

  </div>

  <script>

    const accessCodes = {
      "19rt08af": "./19rt08af/index.html",
      "23ow08ae": "./23ow08ae/index.html"
    };

    function accessFolder() {

      const code = document
        .getElementById("code")
        .value.trim();

      if (accessCodes[code]) {
        window.location.href = accessCodes[code];
      } else {
        document.getElementById("error").textContent =
          "Code invalide, veuillez réessayer. \nInvalid code, please try again";
      }
    }

  </script>

</body>

</html>
